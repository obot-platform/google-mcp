name: build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: analytics
            module: app.server
          - component: calendar
            module: app.server
          - component: docs
            module: app.server
          - component: drive
            module: app.server
          - component: gmail
            module: obot_gmail_mcp.server
          - component: group
            module: app.server
          - component: search-console
            module: app.server
          - component: sheets
            module: app.server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "${{ matrix.component }}/uv.lock"
      - name: Import server
        working-directory: ${{ matrix.component }}
        run: uv run --frozen --no-dev python -c "import ${{ matrix.module }}"

  build:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: ${{ always() }}
    steps:
      - name: Verify smoke tests passed
        env:
          SMOKE_TEST_RESULT: ${{ needs.smoke-test.result }}
        run: test "$SMOKE_TEST_RESULT" = "success"
